#
# Builds the Arribada variant images and pushes them to ghcr.io.
# Runs here rather than on the droplet on purpose: the web build peaks at 2-4 GB
# and the droplet has ~3.8 GB free next to a live Postgres — the OOM killer would
# take out production, not the build.
name: Arribada Build

on:
  push:
    branches: ["arribada/main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v1.3.1-arribada.2)"
        type: string
        default: "v1.3.1-arribada.1"
      build_web:
        description: "Also build the web image (slow: ~30-40 min)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  OWNER: arribada
  # `+` is valid semver build metadata but ILLEGAL in a Docker tag — never use it.
  #
  # The fallback is the COMMIT, not a fixed string. It used to be
  # `inputs.tag || 'v1.3.1-arribada.1'`, so every plain push to arribada/main rebuilt and
  # OVERWROTE `v1.3.1-arribada.1`. A tag therefore did not identify a build: the droplet has
  # `v1.3.1-arribada.5` dated 2026-08-05 (five days after `.4`), and `.77`, `.78`, `.79` and
  # `.80` are all one image id. Nothing on the machine could answer "which commit is this?",
  # which is the first question a rollback asks.
  #
  # `github.sha` is unique per commit and never collides, so a push always produces a new,
  # attributable tag; a deliberate release still passes `tag:` by hand. Paired with the OCI
  # labels below, so `docker inspect` answers the same question offline.
  TAG: ${{ inputs.tag || github.sha }}

jobs:
  typecheck:
    name: typecheck + unit tests (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version here: the repo pins pnpm via package.json "packageManager",
      # and passing version too makes action-setup error on the conflict.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc --noEmit (web + its workspace deps)
        run: pnpm turbo run check:types --filter=web

      - name: Run the web unit tests
        # In this job and not its own because `check:types` above already built
        # every workspace package web imports, and the turbo `test` task needs the
        # same ones — a second runner would pay for that build twice.
        #
        # The floor is the same guard the backend suite carries below, for the
        # same reason: vitest collects by glob (see `include` in
        # apps/web/vitest.config.ts, scoped to four source folders), and a test
        # file written one folder outside it is silently collected as nothing.
        # A suite that runs zero tests reports success. Raise this when you add
        # tests.
        run: |
          set -e
          N=$(pnpm --filter web exec vitest list 2>/dev/null | grep -c " > " || true)
          echo "collected $N web tests"
          if [ "$N" -lt 106 ]; then
            echo "::error::only $N web tests collected, expected at least 106 — did a test file land outside the include glob in apps/web/vitest.config.ts?"
            exit 1
          fi
          pnpm turbo run test --filter=web

  backend:
    name: backend (api/worker/beat/migrator)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # THE TESTS BELOW NEVER RAN. `DATABASE_URL` pointed at 127.0.0.1 with nothing
    # listening on it, so every test carrying the `db` fixture — most of the suite
    # — errored on connect, and the only thing the job actually verified was that
    # pytest could still COLLECT them. The floor was guarding a count, not a
    # result, which is why a security fix could ship with five holes open and a
    # green tick beside it.
    #
    # `ports:` publishes the service on the runner's own host, which is what makes
    # it reachable from the `docker run` steps below: those containers are not on
    # the job's service network, so they join the host's namespace instead.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          load: true
          tags: plane-backend:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Guard against model/migration drift
        run: |
          # Runs INSIDE the shipped image, not on the runner: Plane derives the
          # timezone field choices from the system tz database, so a runner with a
          # newer tzdata than the image reports phantom drift in upstream's `db` app.
          # Scoped to `arribada` for the same reason — a tzdata bump in the base
          # image must never block our builds over a model we do not own.
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=plane.settings.production -e SECRET_KEY=ci \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:5432/d \
            -e REDIS_URL=redis://127.0.0.1:6379/ \
            -e AMQP_URL=amqp://guest:guest@127.0.0.1:5672/ \
            plane-backend:candidate \
            python manage.py makemigrations arribada --check --dry-run

      - name: Verify our routes are wired
        # One-liner on purpose: a multi-line python -c payload inside a YAML block
        # scalar has to stay indented, which python then rejects as an indent error.
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=plane.settings.production -e SECRET_KEY=ci \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:5432/d \
            -e REDIS_URL=redis://127.0.0.1:6379/ \
            -e AMQP_URL=amqp://guest:guest@127.0.0.1:5672/ \
            plane-backend:candidate \
            python -c "import django; django.setup(); from django.urls import get_resolver; routes = [str(p.pattern) for p in get_resolver().url_patterns]; assert 'api/arribada/' in routes, f'arribada routes missing: {routes}'; print('routes OK:', [r for r in routes if 'arribada' in r])"

      - name: Run the arribada test suite
        # Runs in the candidate image BEFORE the push, so a red test cannot produce
        # a deployable artifact. The image carries production deps only, so the
        # throwaway container installs the repo's pinned test tools itself.
        #
        # `--network host` and a real DATABASE_URL: this reaches the `postgres`
        # service declared on the job. Before, the suite pointed at a port with
        # nothing behind it and roughly fifty tests errored on every single run —
        # the permission rules in this app all live in a decorator that queries
        # WorkspaceMember and ProjectMember, so a suite without a database was
        # asserting nothing about the thing most worth asserting.
        #
        # The floor is not decoration either. pytest.ini collects `test_*.py`, and
        # these files were once named `tests_*.py`: `pytest plane/arribada/`
        # collected ZERO and a naive job would have gone green while testing
        # nothing. Exit code 5 catches losing them ALL; the floor catches losing
        # SOME. Raise it when you add tests.
        run: |
          docker run --rm --network host \
            -e DJANGO_SETTINGS_MODULE=plane.settings.test -e SECRET_KEY=ci \
            -e DATABASE_URL=postgresql://plane:plane@127.0.0.1:5432/plane \
            -e REDIS_URL=redis://127.0.0.1:6379/ \
            -e AMQP_URL=amqp://guest:guest@127.0.0.1:5672/ \
            plane-backend:candidate \
            sh -lc '
              set -e
              pip install -q "pytest==9.0.3" "pytest-django==4.5.2"
              cd /code
              # `|| true`: grep -c exits 1 on a count of zero, and under `set -e`
              # that kills the script before the message below ever prints —
              # turning the one failure this guard exists for into a bare exit 1.
              N=$(python -m pytest plane/arribada/ --collect-only -q -o addopts= 2>/dev/null | grep -c "::" || true)
              echo "collected $N arribada tests"
              if [ "$N" -lt 396 ]; then
                echo "::error::only $N arribada tests collected, expected at least 396 — did a test file stop matching pytest.ini python_files (test_*.py)?"
                exit 1
              fi
              python -m pytest plane/arribada/
            '

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/plane-backend:${{ env.TAG }}
          cache-from: type=gha
          # So `docker inspect <image>` answers "what is this?" without a tag to trust.
          # Every backend image on the droplet today has `Labels: null`, which is why the
          # two rollback-* images had to be identified by hand.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/arribada/plane
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

  web:
    name: web (plane-frontend)
    # Only on demand: a 30-40 min build has no business running on every push.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_web }}
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build args on purpose: upstream's CI passes none either, so VITE_* stay
      # empty and the SPA calls the API same-origin. Passing one would diverge.
      # outputs=type=docker,dest writes the FULL single-platform image tar (all
      # layers) — reliable, unlike `load:true`+`docker save` which can capture an
      # empty image on a cache-only build. The tar (gzipped) is the artifact the
      # droplet loads, so no read:packages token is needed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          outputs: type=docker,dest=/tmp/frontend-image.tar
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/plane-frontend:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Same reason as the backend: the tar the droplet loads carries its commit, so
          # `docker inspect` on the served image identifies it without trusting the tag.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/arribada/plane
            org.opencontainers.image.version=${{ env.TAG }}

      - name: Compress image tar
        run: gzip -c /tmp/frontend-image.tar > frontend-image.tgz && ls -lh frontend-image.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: plane-frontend-image
          path: frontend-image.tgz
          retention-days: 5
