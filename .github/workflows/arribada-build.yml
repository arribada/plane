#
# Builds the Arribada variant images and pushes them to ghcr.io.
# Runs here rather than on the droplet on purpose: the web build peaks at 2-4 GB
# and the droplet has ~3.8 GB free next to a live Postgres — the OOM killer would
# take out production, not the build.
name: Arribada Build

on:
  push:
    branches: ["arribada/main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v1.3.1-arribada.2)"
        type: string
        default: "v1.3.1-arribada.1"
      build_web:
        description: "Also build the web image (slow: ~30-40 min)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  OWNER: arribada
  # `+` is valid semver build metadata but ILLEGAL in a Docker tag — never use it.
  TAG: ${{ inputs.tag || 'v1.3.1-arribada.1' }}

jobs:
  backend:
    name: backend (api/worker/beat/migrator)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          load: true
          tags: plane-backend:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Guard against model/migration drift
        run: |
          # Runs INSIDE the shipped image, not on the runner: Plane derives the
          # timezone field choices from the system tz database, so a runner with a
          # newer tzdata than the image reports phantom drift in upstream's `db` app.
          # Scoped to `arribada` for the same reason — a tzdata bump in the base
          # image must never block our builds over a model we do not own.
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=plane.settings.production -e SECRET_KEY=ci \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:5432/d \
            -e REDIS_URL=redis://127.0.0.1:6379/ \
            -e AMQP_URL=amqp://guest:guest@127.0.0.1:5672/ \
            plane-backend:candidate \
            python manage.py makemigrations arribada --check --dry-run

      - name: Verify our routes are wired
        # One-liner on purpose: a multi-line python -c payload inside a YAML block
        # scalar has to stay indented, which python then rejects as an indent error.
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=plane.settings.production -e SECRET_KEY=ci \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:5432/d \
            -e REDIS_URL=redis://127.0.0.1:6379/ \
            -e AMQP_URL=amqp://guest:guest@127.0.0.1:5672/ \
            plane-backend:candidate \
            python -c "import django; django.setup(); from django.urls import get_resolver; routes = [str(p.pattern) for p in get_resolver().url_patterns]; assert 'api/arribada/' in routes, f'arribada routes missing: {routes}'; print('routes OK:', [r for r in routes if 'arribada' in r])"

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/plane-backend:${{ env.TAG }}
          cache-from: type=gha

  web:
    name: web (plane-frontend)
    # Only on demand: a 30-40 min build has no business running on every push.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_web }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build args on purpose: upstream's CI passes none either, so VITE_* stay
      # empty and the SPA calls the API same-origin. Passing one would diverge.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/plane-frontend:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
