  SPDX-License-Identifier: AGPL-3.0-only
  See the LICENSE file for details.

  The Arribada mark, adapted from the dashboard favicon
  (arribada-web-platform/packages/app/public/favicon.svg) for the ~20-24px box
  the workspace header renders it in.

  Three deliberate differences from the source artwork:
   * the glyph and the accent bar are shifted up 3 units so the drawn content
     (y 10..55) is centred in the 64-unit tile instead of sitting low;
   * the accent bar is 5 units tall rather than 4, because at 20px a 4-unit bar
     lands under 1.3 device pixels and antialiases away to a grey smear;
   * the tile is opaque navy. The header sits on bg-canvas, which is near-white
     in the light theme and near-black in the dark one, so a transparent mark
     would disappear in one of them.

  The tile also carries a faint teal edge. #0a1929 measures 1.08:1 against the
  dark theme's canvas, so without it the badge shape vanished there and the mark
  read as a bare white A floating in the sidebar — the light theme got a logo and
  the dark theme got a letter. The stroke is nearly invisible against the navy it
  sits on, so the light theme is unchanged.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  role="img"
  aria-label="Arribada"
>
  <rect
    x="0.75"
    y="0.75"
    width="62.5"
    height="62.5"
    rx="13.5"
    fill="#0a1929"
    stroke="#1de9b6"
    stroke-opacity="0.4"
    stroke-width="1.5"
  />
  <!-- Letter A. fill-rule evenodd cuts the counter out of the outline in a
       single path, so the mark stays one shape at any size. -->
  <path
    fill="#ffffff"
    fill-rule="evenodd"
    d="M32 10 L50 46 L43 46 L39 38 L25 38 L21 46 L14 46 Z M27 32 L37 32 L32 21 Z"
  />
  <!-- Arribada teal accent bar. Solid rather than the gradient of the full
       lockup: a gradient loses all its detail below 32px. -->
  <rect x="16" y="50" width="32" height="5" rx="2.5" fill="#1de9b6" />
</svg>
